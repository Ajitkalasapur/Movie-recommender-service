upstream api_servers {
    # Docker's DNS returns every replica of the "api" service; Nginx spreads requests across them.
    server api:8000;
    # Reuse connections to the replicas; opening one per request runs out of local ports under load.
    keepalive 64;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://api_servers/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
