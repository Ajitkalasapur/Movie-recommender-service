# Nginx load-balances across API replicas; all replicas share one Redis cache.
#   3 replicas with cache:   docker compose up --build
#   1 replica, no cache:     CACHE_ENABLED=false docker compose up --build --scale api=1
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
    deploy:
      replicas: 3
    # The slim image has no curl, so the healthcheck uses Python. Healthy means the model is loaded.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy   # the API connects to Redis once at startup

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy   # start only after every replica is serving, so none is skipped at startup
