<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screening Room: movie recommendations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --velvet-deep: #1A070C;
      --velvet: #2A0E14;
      --claret: #6E1B28;
      --brass: #C9A35B;
      --ivory: #F3E9DA;
      --rose: #BFA6A2;
      --rule: rgba(201, 163, 91, 0.28);
      --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
      --text: "Jost", "Futura", "Avenir Next", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--velvet-deep); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ivory);
      font: 400 1.0625rem/1.6 var(--text);
      background:
        radial-gradient(120% 70% at 50% -10%, rgba(110, 27, 40, 0.55), transparent 60%),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.07) 0 2px, transparent 2px 14px),
        linear-gradient(180deg, var(--velvet) 0%, var(--velvet-deep) 70%);
      background-attachment: fixed;
    }
    .page { max-width: 58rem; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    .masthead { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap;
                border-bottom: 1px solid var(--rule); padding-bottom: 1rem; }
    .wordmark { font: 500 1.35rem/1 var(--display); letter-spacing: 0.04em; color: var(--brass); margin: 0; }
    .masthead p { margin: 0; color: var(--rose); font-size: 0.95rem; }

    h1 { font: 400 clamp(2.6rem, 7vw, 4.75rem)/1.02 var(--display); letter-spacing: -0.015em; margin: 3.25rem 0 1rem; }
    h2 { font: 400 clamp(1.9rem, 4.5vw, 2.8rem)/1.1 var(--display); letter-spacing: -0.01em; margin: 0 0 0.75rem; }
    .lede { font-size: 1.2rem; max-width: 40rem; margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 0.75rem; }
    .hint { color: var(--rose); margin: 0.75rem 0 0; max-width: 40rem; }

    .viewer-input {
      width: 4.5ch; font: 500 2rem/1 var(--display); color: var(--brass); text-align: center;
      background: transparent; border: 0; border-bottom: 2px solid var(--brass); padding: 0 0.15em 0.1em;
      -moz-appearance: textfield;
    }
    .viewer-input::-webkit-outer-spin-button, .viewer-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    button { font: 500 1rem/1 var(--text); cursor: pointer; }
    .primary { background: var(--brass); color: var(--velvet-deep); border: 0; border-radius: 2px; padding: 0.8rem 1.4rem; }
    .primary:hover { background: #D8B571; }
    .primary:disabled { opacity: 0.6; cursor: progress; }
    :focus-visible { outline: 2px solid var(--ivory); outline-offset: 3px; }

    .programme { list-style: none; margin: 2rem 0 0; padding: 0; border-top: 1px solid var(--rule); }
    .programme li { border-bottom: 1px solid var(--rule); }
    .film {
      width: 100%; display: grid; grid-template-columns: 3.25rem 1fr auto; align-items: baseline; gap: 1rem;
      padding: 1.05rem 0.75rem; background: transparent; border: 0; color: inherit; text-align: left;
    }
    .film:hover, .film:focus-visible { background: rgba(110, 27, 40, 0.38); }
    .film:hover .title { color: var(--brass); }
    .rank { font: 500 1.35rem/1 var(--display); color: var(--brass); font-variant-numeric: lining-nums tabular-nums; }
    .title { font: 500 clamp(1.3rem, 3vw, 1.75rem)/1.2 var(--display); transition: color 160ms ease; }
    .year { color: var(--rose); font-variant-numeric: tabular-nums; }
    .meta { color: var(--rose); font-size: 0.95rem; margin: 0.9rem 0 0; min-height: 1.5em; }

    .skeleton .film { cursor: default; }
    .bar { display: block; height: 1.1rem; border-radius: 2px; width: var(--w, 60%);
           background: linear-gradient(90deg, rgba(243, 233, 218, 0.06), rgba(243, 233, 218, 0.16), rgba(243, 233, 218, 0.06));
           background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .reveal { animation: curtain 520ms cubic-bezier(.2, .7, .2, 1) both; }
    @keyframes curtain { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }

    section { margin-top: 4.5rem; }
    .search { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.25rem; max-width: 40rem; }
    .search input {
      flex: 1 1 16rem; font: 400 1.05rem/1.4 var(--text); color: var(--ivory);
      background: rgba(26, 7, 12, 0.6); border: 1px solid var(--rule); border-radius: 2px; padding: 0.75rem 0.9rem;
    }
    .search input::placeholder { color: rgba(191, 166, 162, 0.75); }
    .matches { list-style: none; padding: 0; margin: 1.25rem 0 0; display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; }
    .match { background: none; border: 0; padding: 0.2rem 0; color: var(--ivory); font: 400 1.05rem/1.4 var(--display);
             border-bottom: 1px solid var(--rule); }
    .match:hover { color: var(--brass); border-bottom-color: var(--brass); }
    .similar-heading { margin: 2.5rem 0 0; font: 400 clamp(1.5rem, 3.5vw, 2rem)/1.2 var(--display); }
    .similar-heading .year { font: 400 1rem/1 var(--text); margin-left: 0.5rem; }

    .notice { margin: 1.25rem 0 0; padding: 0.9rem 1rem; border-left: 3px solid var(--brass); background: rgba(26, 7, 12, 0.55); max-width: 40rem; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
                       clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    footer { margin-top: 5rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); color: var(--rose); font-size: 0.9rem; max-width: 44rem; }

    @media (max-width: 560px) {
      .film { grid-template-columns: 2.25rem 1fr; }
      .film .year { grid-column: 2; margin-top: -0.6rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal, .bar { animation: none; }
      .title { transition: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <noscript><p style="padding:2rem">Turn on JavaScript to see recommendations.</p></noscript>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
